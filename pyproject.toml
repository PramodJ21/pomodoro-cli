[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pomodoro-cli"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools]
py-modules = ["run", "db", "session"]

[tool.setuptools.packages.find]
where = ["."]

[project.scripts]
pomodoro-cli = "run:main_wrapper"
